<title>JUC 交互学习手册</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700;900&display=swap">
<style>
/* 布局：左侧目录（单元 → 小节），右侧一次显示一个单元。
   正文是一栏可读宽度；“动手”演示是正文里的卡片：上面旁白和控制，下面左代码、右运行状态。 */
:root{
  --bg:#f1f3f7; --surface:#ffffff; --panel:#f6f8fb; --surface-2:#e8ecf2; --ink:#152033; --ink-2:#47546c; --ink-3:#76829a;
  --line:#d4dae4; --line-2:#b9c3d2;
  --accent:#2b55c4; --accent-ink:#ffffff; --accent-bg:rgba(43,85,196,.09);
  --t1:#2b55c4; --t2:#b13a6d; --t3:#0d8475; --t4:#8a5a22; --on-th:#ffffff;
  --ok:#1b8447; --bad:#c2352c; --wait:#9a650b; --idle:#6f7b91;
  --ok-bg:rgba(27,132,71,.11); --bad-bg:rgba(194,53,44,.10); --wait-bg:rgba(162,106,12,.13); --idle-bg:rgba(111,123,145,.13);
  --c-kw:#8b2fa6; --c-str:#b0482a; --c-com:#76829a; --c-num:#0d7f70; --c-ty:#1d5c9c;
  --code-bg:#f6f8fb;
  --k-mark:#2b55c4; --k-klass:#0d8475; --k-len:#8a5a22; --k-field:#1b8447; --k-ref:#b13a6d; --k-pad:#9aa5b7;
  --f-display:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1219; --surface:#151c27; --panel:#1a2230; --surface-2:#212b39; --ink:#e4e9f1; --ink-2:#a6b1c3; --ink-3:#7d899d;
    --line:#2a3443; --line-2:#3d495b;
    --accent:#86a6ff; --accent-ink:#0d1219; --accent-bg:rgba(134,166,255,.12);
    --t1:#86a6ff; --t2:#f08bb6; --t3:#4fcfbd; --t4:#d9a46a; --on-th:#0d1219;
    --ok:#5bc98a; --bad:#ff7a70; --wait:#f0b350; --idle:#8e9ab0;
    --ok-bg:rgba(91,201,138,.14); --bad-bg:rgba(255,122,112,.13); --wait-bg:rgba(240,179,80,.14); --idle-bg:rgba(142,154,176,.15);
    --c-kw:#d39bf0; --c-str:#f0a080; --c-com:#7d899d; --c-num:#5fd3c2; --c-ty:#8cbcf0;
    --code-bg:#121923;
    --k-mark:#86a6ff; --k-klass:#4fcfbd; --k-len:#d9a46a; --k-field:#5bc98a; --k-ref:#f08bb6; --k-pad:#5a667a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1219; --surface:#151c27; --panel:#1a2230; --surface-2:#212b39; --ink:#e4e9f1; --ink-2:#a6b1c3; --ink-3:#7d899d;
  --line:#2a3443; --line-2:#3d495b;
  --accent:#86a6ff; --accent-ink:#0d1219; --accent-bg:rgba(134,166,255,.12);
  --t1:#86a6ff; --t2:#f08bb6; --t3:#4fcfbd; --t4:#d9a46a; --on-th:#0d1219;
  --ok:#5bc98a; --bad:#ff7a70; --wait:#f0b350; --idle:#8e9ab0;
  --ok-bg:rgba(91,201,138,.14); --bad-bg:rgba(255,122,112,.13); --wait-bg:rgba(240,179,80,.14); --idle-bg:rgba(142,154,176,.15);
  --c-kw:#d39bf0; --c-str:#f0a080; --c-com:#7d899d; --c-num:#5fd3c2; --c-ty:#8cbcf0;
  --code-bg:#121923;
  --k-mark:#86a6ff; --k-klass:#4fcfbd; --k-len:#d9a46a; --k-field:#5bc98a; --k-ref:#f08bb6; --k-pad:#5a667a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.75; margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:0 64px}
h1,h2,h3{text-wrap:balance}
button{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
code,.mono{font-family:var(--f-mono)}

/* ---------- 骨架 ---------- */
.app{max-width:1260px; margin:0 auto; display:grid; grid-template-columns:250px minmax(0, 1fr); gap:40px}
.side{position:sticky; top:env(safe-area-inset-top, 0px); align-self:start; max-height:100vh; overflow:auto; padding-block:28px 24px; font-size:14px}
.brand{display:block; font-family:var(--f-display); font-weight:900; font-size:19px; color:var(--ink); text-decoration:none; line-height:1.3}
.brand small{display:block; font:600 11px var(--f-mono); color:var(--ink-3); letter-spacing:.06em; margin-top:4px}
.toc-btn{display:none}
.toc{display:grid; gap:2px; margin-top:18px}
.toc a{text-decoration:none; color:var(--ink-2); border-radius:7px; padding:4px 8px; display:block}
.toc a:hover{background:var(--surface)}
.toc .toc-u{font-weight:700; color:var(--ink); display:flex; gap:8px; align-items:baseline}
.toc .toc-n{font:600 11px var(--f-mono); color:var(--ink-3); flex:none}
.toc .toc-u.on{background:var(--surface); box-shadow:inset 3px 0 0 var(--accent)}
.toc-s{list-style:none; margin:2px 0 8px; padding:0 0 0 14px; display:none; font-size:13px; line-height:1.5}
.toc-unit.open .toc-s{display:grid; gap:1px}
.toc-s a{padding:3px 8px}
.toc-s a.on{color:var(--accent); background:var(--accent-bg)}
.toc-later{display:flex; gap:8px; align-items:baseline; padding:4px 8px; color:var(--ink-3)}
.toc-later a{padding:0; margin-left:auto; font-size:12px; color:var(--ink-3); text-decoration:underline}
.toc-sep{font:600 11px var(--f-mono); color:var(--ink-3); letter-spacing:.06em; margin:12px 8px 4px}
.side-foot{margin-top:18px; font-size:12.5px; color:var(--ink-3); display:grid; gap:4px; padding:0 8px}
.main{min-width:0; padding-block:36px 0}
.view{min-width:0}
@media (max-width: 980px){
  .app{grid-template-columns:minmax(0, 1fr); gap:0}
  .side{position:static; max-height:none; padding-block:18px 8px; border-bottom:1px solid var(--line)}
  .side-top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .toc-btn{display:inline-block}
  .toc{display:none}
  .side.open .toc{display:grid}
  .side-foot{display:none}
  .side.open .side-foot{display:grid}
  .main{padding-top:20px}
}

/* ---------- 正文 ---------- */
.prose{font-size:16px; line-height:1.85}
.prose > *{max-width:860px}
.prose p, .prose li{max-width:44em}
.prose p{margin:12px 0}
.prose h2{font-family:var(--f-display); font-weight:900; font-size:clamp(21px, 2.6vw, 25px); line-height:1.35; margin:52px 0 14px; padding-top:18px; border-top:1px solid var(--line)}
.prose section{scroll-margin-top:16px}
.prose ul,.prose ol{padding-left:1.4em; margin:10px 0}
.prose li{margin:5px 0}
.prose li::marker{color:var(--ink-3)}
.prose strong{font-weight:700; color:var(--ink)}
.prose :not(pre) > code{font-size:.84em; background:var(--surface-2); padding:1px 5px; border-radius:4px; word-break:break-word}
.prose blockquote{margin:12px 0; padding:10px 16px; border-left:3px solid var(--line-2); color:var(--ink-2); background:var(--surface); border-radius:0 8px 8px 0}
pre.codeblock{position:relative; background:var(--code-bg); border:1px solid var(--line); border-radius:10px; padding:14px 16px; overflow-x:auto; font:13px/1.7 var(--f-mono); margin:14px 0; max-width:860px}
pre.codeblock code{background:none; padding:0; font-size:inherit; white-space:pre}
pre.codeblock[data-lang="text"]{color:var(--ink-2)}
.copy{position:sticky; float:right; left:0; top:0; margin:-6px -8px 0 8px; font:12px var(--f-body); border:1px solid var(--line-2); background:var(--surface); color:var(--ink-3); border-radius:6px; padding:1px 8px; cursor:pointer}
.copy:hover{color:var(--accent); border-color:var(--accent)}
.tbl{overflow-x:auto; margin:14px 0; max-width:860px}
.tbl table{border-collapse:collapse; width:100%; font-size:14.5px; line-height:1.6; background:var(--surface)}
.tbl th,.tbl td{border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top}
.tbl th{background:var(--surface-2); font-weight:700}
.c-kw{color:var(--c-kw)} .c-str{color:var(--c-str)} .c-com{color:var(--c-com); font-style:italic} .c-num{color:var(--c-num)} .c-ty{color:var(--c-ty)}

.u-head{display:grid; gap:6px; margin-bottom:8px}
.u-no{font:600 12px var(--f-mono); color:var(--accent); letter-spacing:.08em}
.u-head h1{font-family:var(--f-display); font-weight:900; font-size:clamp(30px, 4.4vw, 42px); line-height:1.2; margin:0}
.u-sub{margin:0; color:var(--ink-2); font-size:17px}
.motto{margin:6px 0 0; font-size:16.5px; border-left:3px solid var(--accent); padding-left:12px; color:var(--ink)}
.core{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 18px}
.goals{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 18px; display:grid; gap:6px; margin:14px 0}
.g-h{font-weight:700; font-size:14px; color:var(--ink-2)}
.g-row{display:grid; grid-template-columns:auto minmax(0, 1fr); gap:10px; align-items:baseline; font-size:15px}
.g-tag{font:600 11.5px var(--f-mono); border-radius:999px; padding:1px 9px}
.g-must{color:var(--bad); background:var(--bad-bg)} .g-plus{color:var(--accent); background:var(--accent-bg)} .g-know{color:var(--idle); background:var(--idle-bg)}
.hint{color:var(--ink-3); font-size:14px}
details.qa{border:1px solid var(--line); border-radius:12px; background:var(--surface); margin:10px 0; max-width:860px}
details.qa summary{cursor:pointer; padding:12px 16px; font-weight:700; list-style:none; display:flex; gap:10px; align-items:baseline}
details.qa summary::-webkit-details-marker{display:none}
details.qa summary::before{content:"展开"; flex:none; font:600 11px var(--f-mono); color:var(--accent); background:var(--accent-bg); border-radius:5px; padding:1px 7px}
details.qa[open] summary::before{content:"收起"}
details.qa .ans{padding:0 16px 14px; color:var(--ink-2); max-width:none}
.quizlist{list-style:none; padding:0; counter-reset:q; display:grid; gap:10px; max-width:860px}
.qz{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 16px; display:grid; gap:8px; counter-increment:q; max-width:none}
.qz-q{font-weight:700}
.qz-q::before{content:counter(q) ". "; color:var(--ink-3); font-family:var(--f-mono)}
.qz-act{display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.qz-ok{font-size:14px; color:var(--ink-2); display:inline-flex; gap:6px; align-items:center; cursor:pointer}
.qz.done{border-color:var(--ok)}
.qz-a{color:var(--ink-2); border-top:1px dashed var(--line-2); padding-top:8px}
.qz-progress{margin-left:8px; color:var(--ok); font-weight:700}
.pager{display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:56px; padding-top:18px; border-top:1px solid var(--line); max-width:860px}
.pager a{text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px; display:grid; min-width:0}
.pager a span{font:600 11px var(--f-mono); color:var(--ink-3)}
.pager a b{color:var(--ink)}
.pager a:hover{border-color:var(--accent)}

/* ---------- 首页 ---------- */
.home-hero{display:grid; gap:12px; max-width:860px; margin-bottom:12px}
.eyebrow{font:600 12px var(--f-mono); letter-spacing:.08em; color:var(--ink-3)}
.home-hero h1{font-family:var(--f-display); font-weight:900; font-size:clamp(32px, 5vw, 48px); line-height:1.15; margin:0}
.lead{margin:0; color:var(--ink-2); font-size:17px}
.unitmap{list-style:none; margin:18px 0 0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px}
.unitmap li{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:grid; gap:3px; align-content:start; font-size:14px; line-height:1.55}
.unitmap li.ready{border-color:var(--accent)}
.unitmap .un{font:600 11px var(--f-mono); color:var(--ink-3)}
.unitmap .nm{font-weight:700; font-size:15px}
.unitmap .mt{color:var(--ink-2); font-size:13px}
.unitmap .lk{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px}
.unitmap .lk a{font-size:12.5px; text-decoration:none; border-radius:999px; padding:1px 10px; background:var(--accent-bg)}
.unitmap .lk a.go{background:var(--accent); color:var(--accent-ink); font-weight:700}
.unitmap .lk a:not(.go){color:var(--ink-2); background:var(--surface-2)}

/* ---------- 演示卡片 ---------- */
.lab{margin:26px 0; border:1px solid var(--line-2); border-radius:14px; background:var(--surface); padding:16px 18px 18px; display:grid; gap:14px; container-type:inline-size; max-width:none; transition:border-color .2s, box-shadow .2s}
.lab.is-active{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg)}
.lab > *{min-width:0}
.lab-top{display:grid; gap:4px}
.lab-kind{font:600 11.5px var(--f-mono); color:var(--accent); letter-spacing:.06em}
.lab-title{font-size:18px; margin:0; line-height:1.4}
.lab-intro{margin:0; color:var(--ink-2); font-size:14.5px; line-height:1.7}
.narr{display:grid; gap:2px; min-height:96px; background:var(--panel); border-radius:10px; padding:10px 14px}
.narr-k{font:600 11.5px var(--f-mono); color:var(--ink-3)}
.narr-t{font-size:16px; font-weight:700; margin:0; line-height:1.5}
.narr-p{margin:0; color:var(--ink-2); font-size:14.5px; line-height:1.7}
.narr-p b{color:var(--ink)}
.ctrl{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between}
.btns{display:flex; flex-wrap:wrap; gap:8px}
.btn{border:1px solid var(--line-2); background:var(--surface); border-radius:8px; padding:5px 12px; cursor:pointer; font-size:14px; white-space:nowrap; line-height:1.6}
.btn.sm{font-size:13px; padding:2px 10px}
.btn:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:700}
.btn.primary:hover:not(:disabled){filter:brightness(1.07); color:var(--accent-ink)}
.btn.ghost{border-color:transparent; color:var(--ink-3)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line-2); border-radius:9px; padding:2px; gap:2px; background:var(--surface-2)}
.seg button{border:0; background:transparent; border-radius:7px; padding:4px 11px; cursor:pointer; font-size:13.5px; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); font-weight:700; box-shadow:0 1px 2px rgba(0,0,0,.1)}
.dots{list-style:none; margin:0; padding:0; display:flex; gap:4px; flex-wrap:wrap}
.dots button{width:24px; height:6px; border-radius:3px; border:0; background:var(--line); cursor:pointer; padding:0}
.dots button.on{background:var(--accent)} .dots button.past{background:var(--line-2)}
.bench{display:grid; grid-template-columns:minmax(0, 1fr) minmax(0, 1.25fr); gap:14px; align-items:start}
.bench.stack{grid-template-columns:minmax(0, 1fr)}
@container (max-width: 720px){ .bench{grid-template-columns:minmax(0, 1fr)} }
@media (max-width: 640px){ .bench{grid-template-columns:minmax(0, 1fr)} }
.code-col{display:grid; gap:10px; min-width:0}
.stage{min-width:0}
.code{background:var(--code-bg); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.code-h{font:600 11.5px var(--f-mono); color:var(--ink-3); padding:6px 12px; border-bottom:1px solid var(--line); background:var(--surface-2)}
.code-b{position:relative; max-height:360px; overflow:auto; padding:6px 0; font:12.5px/1.75 var(--f-mono)}
.ln{display:flex; align-items:center; white-space:pre; min-width:100%; width:max-content; padding-right:10px}
.ln .no{flex:none; width:2.8em; color:var(--ink-3); text-align:right; padding-right:12px; opacity:.6; user-select:none; font-size:11px}
.ln .tx{flex:1 0 auto}
.ln.hl{background:var(--accent-bg); background:color-mix(in srgb, var(--c) 15%, transparent); box-shadow:inset 3px 0 0 var(--c)}
.ln .who{position:sticky; right:6px; flex:none; font:600 10.5px var(--f-mono); color:var(--on-th); background:var(--c); border-radius:4px; padding:0 5px; margin-left:12px}
.box{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; min-width:0}
.box-h{font-size:13px; font-weight:700; color:var(--ink-2); margin-bottom:6px}
.rk{font:600 11.5px var(--f-mono); color:var(--ink-3); letter-spacing:.02em}
.none{color:var(--ink-3); font-size:13px}
.note{color:var(--ink-3); font-size:12.5px}
.th{display:inline-flex; align-items:center; justify-content:center; min-width:30px; height:24px; padding:0 7px; border-radius:6px; background:var(--c); color:var(--on-th); font:600 12px var(--f-mono); vertical-align:middle; white-space:nowrap}
.pill{display:inline-block; font:600 11px var(--f-mono); padding:1px 8px; border-radius:999px; white-space:nowrap; line-height:1.7}
.pill.ok{color:var(--ok); background:var(--ok-bg)} .pill.bad{color:var(--bad); background:var(--bad-bg)}
.pill.wait{color:var(--wait); background:var(--wait-bg)} .pill.idle{color:var(--idle); background:var(--idle-bg)}
.tag{font:600 10.5px var(--f-mono); color:var(--accent); border:1px solid var(--accent); border-radius:4px; padding:0 5px; white-space:nowrap}
.chip{display:inline-flex; align-items:center; font:600 12px var(--f-mono); border:1px solid var(--line-2); background:var(--surface); border-radius:6px; padding:1px 8px}
.chip.warn{border-color:var(--wait); color:var(--wait); background:var(--wait-bg)}
.chg{animation:flash 1.3s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)} 100%{box-shadow:0 0 0 0 transparent}}
.grid2{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:10px}
.stack-v{display:grid; gap:10px}
@container (max-width: 520px){ .grid2{grid-template-columns:minmax(0, 1fr)} }
.verdict{border-radius:10px; padding:10px 14px; font-size:14.5px; line-height:1.7}
.verdict.bad{background:var(--bad-bg); border:1px solid var(--bad)}
.verdict.ok{background:var(--ok-bg); border:1px solid var(--ok)}
.big{font:700 28px/1.2 var(--f-mono); color:var(--accent)}
.kv{display:grid; gap:2px}
.thr{width:100%; border-collapse:collapse; font-size:13px; line-height:1.5}
.thr th{font:600 11px var(--f-mono); color:var(--ink-3); text-align:left; padding:4px 6px; border-bottom:1px solid var(--line)}
.thr td{padding:6px; border-bottom:1px solid var(--line); vertical-align:top}
.thr tr:last-child td{border-bottom:0}
.tn{font-size:12px; color:var(--ink-3)}
.js{font-size:11.5px; word-break:break-all}
.tbl-wrap{overflow-x:auto}

/* Monitor 区域 */
.zones{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:8px}
@container (max-width: 460px){ .zones{grid-template-columns:minmax(0, 1fr)} }
.zone{border:1px solid var(--line-2); border-radius:9px; padding:7px 9px; display:grid; gap:5px; align-content:start; min-height:88px; background:var(--surface)}
.zone .zk{font:700 12.5px var(--f-mono)}
.zone .zs{font-size:11.5px; color:var(--ink-3)}
.zone .toks{display:flex; gap:5px; flex-wrap:wrap; min-height:26px; align-items:center}
.z-owner{border-color:var(--ok); background:var(--ok-bg)} .z-entry{border-color:var(--bad); background:var(--bad-bg)} .z-wait{border-color:var(--wait); background:var(--wait-bg)}

/* Mark Word 条 / 比特 */
.mw-head{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px}
.mw-head code{font-size:13px; font-weight:600}
.strip-wrap{overflow-x:auto}
.strip{display:flex; gap:2px; min-width:280px}
.seg-b{min-width:0; background:var(--surface-2); border-radius:5px; padding:3px 5px; display:grid; overflow:hidden}
.seg-b .sv{font:600 11.5px var(--f-mono); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg-b .sl{font-size:10.5px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg-b.key{background:var(--accent-bg); outline:1.5px solid var(--accent); min-width:56px; flex-shrink:0}
.seg-b.key .sv{color:var(--accent); font-size:13px}
.bits{display:grid; gap:4px}
.bitrow{display:grid; grid-template-columns:repeat(32, minmax(0, 1fr)); gap:2px}
.bit{font:600 clamp(9px, 1.6cqi, 12px)/1 var(--f-mono); text-align:center; padding:5px 0; border-radius:3px; background:var(--surface-2); color:var(--ink-2)}
.bitaxis{display:flex; justify-content:space-between; font:10.5px var(--f-mono); color:var(--ink-3)}
.k-u{opacity:.55}
.k-h{background:color-mix(in srgb, var(--t3) 22%, transparent); color:var(--ink)}
.k-a{background:color-mix(in srgb, var(--t4) 22%, transparent); color:var(--ink)}
.k-b{background:color-mix(in srgb, var(--t2) 22%, transparent); color:var(--ink)}
.k-l{background:var(--accent); color:var(--accent-ink)}
.k-t,.k-p{background:color-mix(in srgb, var(--t1) 20%, transparent); color:var(--ink)}
.k-e{background:color-mix(in srgb, var(--t2) 14%, transparent); color:var(--ink)}
.seglegend{list-style:none; margin:8px 0 0; padding:0; display:grid; gap:3px; font-size:13px}
.seglegend li{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.seglegend .sw{width:12px; height:12px; border-radius:3px; flex:none}
.seglegend code{font-size:12.5px}

/* 对象布局 */
.bytemap{display:grid; gap:4px}
.brow{display:grid; grid-template-columns:3.2em minmax(0, 1fr); gap:6px; align-items:stretch}
.boff{font:600 11px var(--f-mono); color:var(--ink-3); align-self:center; text-align:right}
.bcells{display:grid; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:3px}
.bpart{border-radius:6px; padding:5px 6px; font-size:12px; line-height:1.35; color:var(--ink); border:1.5px solid var(--kc); background:color-mix(in srgb, var(--kc) 16%, transparent); min-width:0; overflow:hidden}
.bpart b{display:block; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.bpart span{font:11px var(--f-mono); color:var(--ink-3)}
.bpart.pad{border-style:dashed; background:repeating-linear-gradient(135deg, transparent 0 5px, color-mix(in srgb, var(--kc) 22%, transparent) 5px 7px)}
.total{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin-top:8px}
.total b{font:700 22px var(--f-mono); color:var(--accent)}

/* 状态机 */
.sm-svg{width:100%; height:auto; display:block}
.sm-node rect{fill:var(--surface); stroke:var(--line-2); stroke-width:1.25}
.sm-node text{fill:var(--ink); font:600 13px var(--f-mono)}
.sm-node.cur rect{fill:var(--accent-bg); stroke:var(--accent); stroke-width:2.5}
.sm-node.cur text{fill:var(--accent)}
.sm-edge{fill:none; stroke:var(--line-2); stroke-width:1.5}
.sm-edge.on{stroke:var(--accent); stroke-width:3}
.sm-arrow{fill:var(--line-2)} .sm-arrow-on{fill:var(--accent)}
.sm-lbl{fill:var(--ink-3); font:11px var(--f-body)}
.sm-acts{display:flex; flex-wrap:wrap; gap:8px}
.sm-hist{font:12.5px var(--f-mono); color:var(--ink-3); word-break:break-all}

/* happens-before */
.hb-svg{width:100%; height:auto; display:block}
.hb-box rect{fill:var(--surface); stroke:var(--line-2); stroke-width:1.25}
.hb-box.on rect{stroke:var(--accent); stroke-width:2}
.hb-box text{fill:var(--ink); font:600 13px var(--f-mono)}
.hb-box .sub{fill:var(--ink-3); font:11.5px var(--f-body)}
.hb-col{fill:var(--ink-3); font:600 12px var(--f-body)}
.hb-e{fill:none; stroke-width:2.2}
.hb-e.ok{stroke:var(--accent)}
.hb-e.der{stroke:var(--ok); stroke-dasharray:6 5}
.hb-e.no{stroke:var(--bad); stroke-dasharray:4 4}
.hb-l{font:11.5px var(--f-body)}
.hb-l.ok{fill:var(--accent)} .hb-l.der{fill:var(--ok)} .hb-l.no{fill:var(--bad)}
.hb-m-ok{fill:var(--accent)} .hb-m-der{fill:var(--ok)}

/* 进度条 */
.bar{height:7px; border-radius:4px; background:var(--surface-2); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); transition:width .4s}
.lane{display:grid; gap:6px}
.lane-h{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.reg{font:600 13px var(--f-mono)}

/* 竞态 */
.bc{list-style:none; margin:0; padding:0; display:grid; gap:2px; font:12.5px/1.6 var(--f-mono)}
.bc li{display:grid; grid-template-columns:16px minmax(0, 1fr) auto; gap:6px; padding:3px 8px; border-radius:6px; color:var(--ink-2)}
.bc li.done{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-2)}

/* 可见性 */
.core-c{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px; display:grid; gap:8px}

.mesi{font:700 12.5px var(--f-mono); width:24px; height:24px; border-radius:6px; display:inline-flex; align-items:center; justify-content:center; border:1px solid currentColor}
.m-M{color:var(--accent)} .m-E{color:var(--t3)} .m-S{color:var(--ok)} .m-I{color:var(--bad)}

.bview{display:flex; gap:10px; align-items:center; border-radius:10px; padding:8px 12px; font-size:14px; border:1px solid var(--line); background:var(--surface)}
.bview.exit{background:var(--ok-bg); border-color:var(--ok)} .bview.forever{background:var(--bad-bg); border-color:var(--bad)}

/* 锁升级阶梯 */
.ladder{display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:6px}
@container (max-width: 520px){ .ladder{grid-template-columns:repeat(2, minmax(0, 1fr))} }

<script>
(() => {
'use strict';
const TOC = /*TOC_JSON*/null;
const DOC_URL = 'https://github.com/erha1499/learn-juc/blob/main/content/handbook.md';
const LAB_URL = 'lab/index.html';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)').matches : false;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const KW = new Set('public private protected static final void int long boolean new synchronized while if else return for try catch true false null volatile this class extends throw'.split(' '));
function hiJava(src) {
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*")|\b([A-Za-z_][A-Za-z0-9_]*)\b|\b(\d+)\b/g;
  let out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="c-com">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="c-str">' + esc(m[2]) + '</span>';
    else if (m[3]) out += KW.has(m[3]) ? '<span class="c-kw">' + m[3] + '</span>' : (/^[A-Z]/.test(m[3]) ? '<span class="c-ty">' + m[3] + '</span>' : m[3]);
    else if (m[4]) out += '<span class="c-num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
const TCOL = {A: 't1', B: 't2', C: 't3', T1: 't1', T2: 't2', T3: 't3', T4: 't4', main: 't3', waiter: 't1', owner: 't2', blocked: 't3', t: 't1'};
const th = (t, key) => '<span class="th" style="--c:var(--' + (TCOL[t] || 't1') + ')"' + (key ? ' data-flip="' + key + '"' : '') + '>' + t + '</span>';
const PILL = {RUNNABLE: 'ok', BLOCKED: 'bad', WAITING: 'wait', TIMED_WAITING: 'wait', NEW: 'idle', TERMINATED: 'idle'};
const pill = st => '<span class="pill ' + (PILL[st] || 'idle') + '">' + st + '</span>';
const chg = (step, k) => (step && step.chg && step.chg.includes(k) ? ' chg' : '');

function flip(container, update) {
  const before = {};
  if (!RM) $$('[data-flip]', container).forEach(el => { before[el.dataset.flip] = el.getBoundingClientRect(); });
  update();
  if (RM || !container.offsetParent) return;
  $$('[data-flip]', container).forEach(el => {
    if (!el.animate) return;
    const b = before[el.dataset.flip], a = el.getBoundingClientRect();
    if (!b) { el.animate([{opacity: 0, transform: 'scale(.8)'}, {opacity: 1, transform: 'none'}], {duration: 320, easing: 'ease-out'}); return; }
    const dx = b.left - a.left, dy = b.top - a.top;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1) el.animate([{transform: 'translate(' + dx + 'px,' + dy + 'px)'}, {transform: 'none'}], {duration: 560, easing: 'cubic-bezier(.2,.75,.2,1)'});
  });
}
function codePanel(p, hl) {
  const marks = {};
  (hl || []).forEach(h => {
    if (h.p !== p.id) return;
    let idx = h.i;
    if (idx == null) {
      idx = p.lines.findIndex(L => L.includes(h.f));
      if (idx < 0 && window.console) console.warn('高亮行没找到：', h.f);
    }
    if (idx >= 0) marks[idx] = h.t || 'A';
  });
  const body = p.lines.map((L, i) => {
    const m = marks[i];
    return '<div class="ln' + (m ? ' hl' : '') + '"' + (m ? ' style="--c:var(--' + TCOL[m] + ')"' : '') + '><span class="no">' + (p.nums ? esc(p.nums[i]) : i + 1) + '</span><span class="tx">' + ((p.plain ? esc(L) : hiJava(L)) || ' ') + '</span>' + (m ? '<span class="who">' + m + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="code"><div class="code-h">' + esc(p.title) + '</div><div class="code-b">' + body + '</div></div>';
}
function scrollHl(col) {
  $$('.code-b', col).forEach(b => {
    const el = $('.hl', b);
    if (!el) return;
    const top = el.offsetTop;
    if (top < b.scrollTop + 8 || top > b.scrollTop + b.clientHeight - 40) b.scrollTop = Math.max(0, top - b.clientHeight / 3);
  });
}
function zones(mon) {
  const z = (cls, k, list, sub) => '<div class="zone ' + cls + '"><div class="zk">' + k + '</div><div class="toks">' + (list.length ? list.map(t => th(t, 'tok-' + t)).join('') : '<span class="none">空</span>') + '</div><div class="zs">' + sub + '</div></div>';
  return '<div class="zones">' + z('z-owner', 'Owner', mon.owner ? [mon.owner] : [], '持有锁的线程') + z('z-entry', 'EntryList', mon.entry, '等锁 · BLOCKED') + z('z-wait', 'WaitSet', mon.wait, '调用了 wait · WAITING') + '</div>';
}
function thrTable(names, tmap, st) {
  return '<div class="tbl-wrap"><table class="thr"><thead><tr><th>线程</th><th>状态</th><th>jstack 里能看到</th></tr></thead><tbody>' + names.map(t => {
    const x = tmap[t];
    return '<tr class="' + chg(st, 'th' + t).trim() + '"><td>' + th(t) + '</td><td>' + pill(x.st) + (x.note ? '<div class="tn">' + x.note + '</div>' : '') + '</td><td><code class="js">' + esc(x.js || '—') + '</code></td></tr>';
  }).join('') + '</tbody></table></div>';
}
const TS = (st, js, note) => ({st, js: js || '', note: note || ''});

/* ===================== 键盘 / 活动演示 ===================== */
let ACTIVE = null;
const STOPPERS = [];
function setActive(l) { if (ACTIVE === l) return; if (ACTIVE) ACTIVE.classList.remove('is-active'); ACTIVE = l; l.classList.add('is-active'); }
document.addEventListener('pointerdown', e => { const l = e.target.closest('.lab'); if (l) setActive(l); }, true);
document.addEventListener('focusin', e => { const l = e.target.closest('.lab'); if (l) setActive(l); });
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || !ACTIVE || !ACTIVE.offsetParent || !ACTIVE._key) return;
  const tg = e.target, tag = tg && tg.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if (e.key === ' ' && tag === 'BUTTON') return;
  if (ACTIVE._key(e)) e.preventDefault();
});

/* ===================== 逐步演示引擎 ===================== */
function labTop(cfg) {
  return '<div class="lab-top"><span class="lab-kind">动手 · ' + (cfg.kind || '逐步演示') + '</span><h3 class="lab-title">' + cfg.title + '</h3>' + (cfg.intro ? '<p class="lab-intro">' + cfg.intro + '</p>' : '') + '</div>';
}
function stepLab(root, cfg) {
  root.classList.add('lab');
  const seg = cfg.variants ? '<div class="seg" role="group" aria-label="' + cfg.variantLabel + '">' + cfg.variants.map(v => '<button type="button" data-v="' + v.key + '">' + v.label + '</button>').join('') + '</div>' : '<span></span>';
  root.innerHTML = labTop(cfg) +
    '<div class="narr" aria-live="polite"><div class="narr-k"></div><p class="narr-t"></p><p class="narr-p"></p></div>' +
    '<div class="ctrl">' + seg + '<div class="btns"><button type="button" class="btn b-prev">← 上一步</button><button type="button" class="btn b-play">▶ 自动播放</button><button type="button" class="btn primary b-next">下一步 →</button><button type="button" class="btn ghost b-reset">从头开始</button></div></div>' +
    '<ol class="dots"></ol>' +
    '<div class="bench' + (cfg.stack ? ' stack' : '') + '">' + (cfg.code ? '<div class="code-col"></div>' : '') + '<div class="stage"></div></div>';
  const q = s => $(s, root);
  const codeCol = q('.code-col'), stage = q('.stage'), K = q('.narr-k'), T = q('.narr-t'), P = q('.narr-p'), dots = q('.dots');
  const bPrev = q('.b-prev'), bNext = q('.b-next'), bPlay = q('.b-play');
  const S = {v: cfg.variants ? cfg.variants[0].key : null, i: 0, timer: null};
  let steps = cfg.steps(S.v);
  function render() {
    const st = steps[S.i];
    if (codeCol) { codeCol.innerHTML = cfg.code(S.v).map(p => codePanel(p, st.hl)).join(''); scrollHl(codeCol); }
    flip(stage, () => { stage.innerHTML = cfg.stage(st.s, st, S.v); });
    K.textContent = '第 ' + (S.i + 1) + ' / ' + steps.length + ' 步';
    T.textContent = st.t;
    P.innerHTML = st.d;
    dots.innerHTML = steps.map((s, i) => '<li><button type="button" data-i="' + i + '" class="' + (i === S.i ? 'on' : i < S.i ? 'past' : '') + '" aria-label="第 ' + (i + 1) + ' 步：' + esc(s.t) + '"' + (i === S.i ? ' aria-current="step"' : '') + '></button></li>').join('');
    bPrev.disabled = S.i === 0;
    bNext.disabled = S.i === steps.length - 1;
    bPlay.textContent = S.timer ? '⏸ 暂停' : (S.i === steps.length - 1 ? '↻ 从头播放' : '▶ 自动播放');
    $$('.seg button', root).forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.v ? 'true' : 'false'));
  }
  const go = i => { S.i = Math.max(0, Math.min(steps.length - 1, i)); render(); };
  const stop = () => { if (S.timer) { clearInterval(S.timer); S.timer = null; } };
  function play() {
    if (S.timer) { stop(); render(); return; }
    if (S.i === steps.length - 1) S.i = 0;
    S.timer = setInterval(() => { if (S.i >= steps.length - 1) { stop(); render(); return; } go(S.i + 1); }, 3600);
    render();
  }
  bPrev.onclick = () => { stop(); go(S.i - 1); };
  bNext.onclick = () => { stop(); go(S.i + 1); };
  bPlay.onclick = play;
  q('.b-reset').onclick = () => { stop(); go(0); };
  dots.onclick = e => { const b = e.target.closest('button'); if (b) { stop(); go(+b.dataset.i); } };
  $$('.seg button', root).forEach(b => { b.onclick = () => { stop(); S.v = b.dataset.v; steps = cfg.steps(S.v); S.i = Math.min(S.i, steps.length - 1); render(); }; });
  root._key = e => {
    if (e.key === 'ArrowRight') { stop(); go(S.i + 1); return true; }
    if (e.key === 'ArrowLeft') { stop(); go(S.i - 1); return true; }
    if (e.key === ' ') { play(); return true; }
    return false;
  };
  STOPPERS.push(() => { if (S.timer) { stop(); render(); } });
  render();
}

/* ===================== 1.5 对象布局 ===================== */
const LAYOUTS = [
  {k: 'obj', label: 'new Object()', code: ['Object o = new Object();'], size: 16, parts: [[0, 8, 'mark', 'Mark Word'], [8, 4, 'klass', '类型指针'], [12, 4, 'pad', '对齐填充']],
    note: '没有任何字段：对象头 8 + 4 = 12 字节，再补 4 字节凑成 8 的倍数。'},
  {k: 'point', label: 'Point', code: ['class Point {', '    int x;', '}'], size: 16, parts: [[0, 8, 'mark', 'Mark Word'], [8, 4, 'klass', '类型指针'], [12, 4, 'field', 'int x']],
    note: 'int x 正好填进对象头后面的 4 字节，不需要填充。x 的偏移量 12 是用 Unsafe.objectFieldOffset 实测的（3.3 节）。'},
  {k: 'arr', label: 'new int[3]', code: ['int[] a = new int[3];'], size: 32, parts: [[0, 8, 'mark', 'Mark Word'], [8, 4, 'klass', '类型指针'], [12, 4, 'len', '长度 = 3'], [16, 4, 'field', 'a[0]'], [20, 4, 'field', 'a[1]'], [24, 4, 'field', 'a[2]'], [28, 4, 'pad', '对齐填充']],
    note: '数组的对象头多 4 字节存长度，所以元素从第 16 字节开始（实测 arrayBaseOffset = 16）。12 + 4 + 3 × 4 = 28，补齐到 32。'},
  {k: 'mixed', label: 'Mixed', code: ['class Mixed {', '    boolean flag;', '    int x;', '    long y;', '    Object ref;', '}'], size: 32, parts: [[0, 8, 'mark', 'Mark Word'], [8, 4, 'klass', '类型指针'], [12, 4, 'field', 'int x'], [16, 8, 'field', 'long y'], [24, 1, 'field', 'flag'], [25, 3, 'pad', '空隙'], [28, 4, 'ref', 'Object ref']],

const SMN = {NEW: [115, 54, 150], RUNNABLE: [380, 54, 150], TERMINATED: [645, 54, 150], BLOCKED: [140, 236, 150], WAITING: [380, 236, 150], TIMED_WAITING: [620, 236, 170]};

      ['进入 synchronized，锁被别人占着', 'BLOCKED', null, 'RB', '抢 monitor 失败，进入 EntryList。<b>BLOCKED 只在等 synchronized 的锁时出现。</b>'],
      ['lock.wait()', 'WAITING', 'wait', 'RW', '释放锁，进入对象的 WaitSet，等别人 notify。'],
      ['LockSupport.park()（比如等 ReentrantLock）', 'WAITING', 'park', 'RW', '被 park 挂起。等 ReentrantLock 的线程就是这个状态，jstack 显示 WAITING (parking)，<b>不是 BLOCKED</b>。'],
      ['other.join()', 'WAITING', 'join', 'RW', '等另一个线程结束。join 的底层是 while (isAlive()) wait(0)，所以它也是在一个对象的 monitor 上等待。'],
      ['Thread.sleep(100)', 'TIMED_WAITING', 'sleep', 'RT', '带超时地睡眠。注意：如果手里拿着锁，sleep 不会释放它。'],
      ['lock.wait(100)', 'TIMED_WAITING', 'waitn', 'RT', '带超时的 wait：释放锁，进 WaitSet，最多等 100 毫秒。'],
      ['run() 执行完', 'TERMINATED', null, 'RX', 'run 正常结束或抛出了没被捕获的异常，线程终止。']];
    case 'BLOCKED': return [['持锁线程释放了锁，抢到了', 'RUNNABLE', null, 'BR', '拿到 monitor，成为 Owner，回到 RUNNABLE。']];
    case 'WAITING':

  const runSeq = seq => { reset(R.mode); let i = 0; auto = setInterval(() => { if (i >= seq.length) { stopAuto(); render(); return; } step(seq[i++]); }, RM ? 400 : 1300); };

  hb: el => stepLab(el, {kind: '推导链', title: '用 happens-before 推出 ④ 一定打印 42', intro: '一条边一条边地连。切换到“普通变量”，看链条从哪里断开。', variants: [{key: 'vol', label: 'ready 是 volatile'}, {key: 'plain', label: 'ready 是普通变量'}], variantLabel: 'ready 的类型', code: HB_CODE, steps: hbSteps, stage: hbStage}),
  dcl: el => stepLab(el, {title: '没有 volatile 的 DCL 怎么拿到“半个对象”', intro: '两个线程同时调用 getInstance()。切换有无 volatile，对比 ② ③ 的执行顺序。', variants: [{key: 'plain', label: '没有 volatile'}, {key: 'vol', label: '加上 volatile'}], variantLabel: 'instance 的声明', code: DCL_CODE, steps: dclSteps, stage: dclStage}),
  bytecode: el => stepLab(el, {title: '沿着字节码走一遍：正常出口和异常出口', intro: '同一段字节码，切换“正常执行 / 抛出异常”，看两条路径怎么都走到 monitorexit。', variants: [{key: 'ok', label: '正常执行'}, {key: 'ex', label: '抛出异常'}], variantLabel: '执行路径', code: BC_CODE, steps: bcSteps, stage: bcStage}),
  markword: markWordLab,
  lifecycle: el => stepLab(el, {kind: '综合演练', title: 'synchronized 的一生', intro: '把本单元串起来：一个对象从创建到被两个线程争抢，Mark Word 怎么变，ObjectMonitor 什么时候出现，线程怎么在三个区域之间移动。', code: LC_CODE, steps: lcSteps, stage: lcStage}),
  upgrade: el => stepLab(el, {title: '锁升级：每一级省掉了什么', intro: '偏向锁打开时，一个对象先后被 T1、T2、T3 加锁。看 Mark Word 的比特怎么变，以及每次加锁付出的代价。', code: UP_CODE, steps: upSteps, stage: upStage})
};
$$('.lab-mount').forEach(el => {
  const f = LABS[el.dataset.lab];
  try { f(el); } catch (err) { el.innerHTML = '<p class="none">这个演示加载失败：' + esc(err.message) + '</p>'; if (window.console) console.error(err); }
});

/* ===================== 代码块高亮 / 复制 ===================== */
$$('pre.codeblock').forEach(pre => {
  const code = $('code', pre), raw = code.textContent;
  if (pre.dataset.lang === 'java') code.innerHTML = raw.split('\n').map(hiJava).join('\n');
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'copy'; b.textContent = '复制';
  b.onclick = () => {
    const done = ok => { b.textContent = ok ? '已复制' : '请手动选中复制'; setTimeout(() => { b.textContent = '复制'; }, 1600); };
    try { navigator.clipboard.writeText(raw).then(() => done(true), () => done(false)); } catch (e) { done(false); }
  };
  pre.insertBefore(b, code);
});

const store = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 浏览器不允许存储时忽略 */ } }};
function quizProgress(sec) {
  const all = $$('.qz', sec), ok = all.filter(q => $('.qz-cb', q).checked).length, p = $('.qz-progress', sec);
  if (p) p.textContent = ok ? '已掌握 ' + ok + ' / ' + all.length : '';
}
$$('section.quiz').forEach(sec => {
  $$('.qz', sec).forEach(q => {
    const cb = $('.qz-cb', q), btn = $('.qz-show', q), ans = $('.qz-a', q), key = 'juc-course-' + q.dataset.qid;
    cb.checked = store.get(key) === '1';
    q.classList.toggle('done', cb.checked);
    btn.onclick = () => { ans.hidden = !ans.hidden; btn.textContent = ans.hidden ? '看答案' : '收起答案'; btn.setAttribute('aria-expanded', String(!ans.hidden)); };
    cb.onchange = () => { store.set(key, cb.checked ? '1' : '0'); q.classList.toggle('done', cb.checked); quizProgress(sec); };
  });
  quizProgress(sec);
});

/* ===================== 路由与滚动高亮 ===================== */
let curView = null, spy = null;
function show(view, sec) {
  if (curView !== view) {
    STOPPERS.forEach(f => f());
    $$('.view').forEach(v => { v.hidden = v.dataset.view !== view; });
    curView = view;
    $$('.toc-u').forEach(a => a.classList.toggle('on', a.dataset.u === view));
    $$('.toc-unit').forEach(d => d.classList.toggle('open', d.dataset.u === view));
    setupSpy(view);
  }
  $('#side').classList.remove('open'); $('#toc-btn').setAttribute('aria-expanded', 'false');
  const target = sec && document.getElementById(sec);
  if (target) target.scrollIntoView({block: 'start'}); else window.scrollTo(0, 0);
}
function setupSpy(view) {
  if (spy) spy.disconnect();
  if (!('IntersectionObserver' in window)) return;
  const secs = $$('#view-' + view + ' section[id]');
  spy = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      $$('.toc-s a').forEach(a => a.classList.toggle('on', a.dataset.s === en.target.id));
    });
  }, {rootMargin: '0px 0px -70% 0px'});
  secs.forEach(s => spy.observe(s));
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const m = h.match(/^(u\d+)(?:-[a-z0-9]+)?$/);
  if (m && document.getElementById('view-' + m[1])) show(m[1], h === m[1] ? null : h);
  else show('home', null);
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  const h = a.getAttribute('href');
  if (h === location.hash) { e.preventDefault(); route(); }
});
window.addEventListener('hashchange', route);
route();
})();
